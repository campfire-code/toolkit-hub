# 复用检查工作流：工具仓库推送代码或提交 PR 时调用，跑类型检查与单元测试（Windows + macOS）。
name: tauri-check

on:
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
